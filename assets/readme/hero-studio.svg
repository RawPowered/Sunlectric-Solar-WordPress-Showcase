<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 770" role="img" aria-labelledby="title desc">
<title id="title">Hero Studio editor structure</title><desc id="desc">Illustration of slide selection, live hero canvas, layer controls, and motion timeline.</desc>
